{% extends "base.html" %}
{% block title %}로그인 — 복주 상담실{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-mark">복주</div>
            <h1>복주 상담실 CRM</h1>
            <p class="login-sub">인덕의료재단 · 복주회복병원 상담실</p>
        </div>
        <form method="post" action="/login" class="login-form">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <label class="login-field">
                <span>아이디</span>
                <input type="text" name="username" autocomplete="username" autofocus required
                       placeholder="이름 또는 계정 아이디">
            </label>
            <label class="login-field">
                <span>비밀번호</span>
                <input type="password" name="password" autocomplete="current-password" required
                       placeholder="비밀번호">
            </label>
            <div class="login-preferences">
                <div class="login-options">
                    <label><input type="checkbox" id="remember-id"> <span><b>아이디 기억</b><small>아이디만 저장</small></span></label>
                    <span class="login-option-divider" aria-hidden="true"></span>
                    <label><input type="checkbox" id="auto-login" name="auto_login" value="1"> <span><b>자동 로그인</b><small>30일간 유지</small></span></label>
                </div>
                <p class="login-auto-note">공용 PC에서는 자동 로그인을 사용하지 마세요.</p>
            </div>
            <button type="submit" class="btn btn-primary login-submit">로그인</button>
            <button type="button" class="login-reset-request" id="password-reset-request">비밀번호 초기화 요청</button>
        </form>
        <p class="login-note">
            요청을 보내면 관리자가 사용자 관리 화면에서 확인합니다.
        </p>
    </div>
    <p class="login-footnote">사내망 전용 · 환자 정보는 외부로 전송되지 않습니다.</p>
</div>
<script>
(function(){
    const form=document.querySelector('.login-form');
    const username=form?.querySelector('[name="username"]');
    const remember=document.getElementById('remember-id');
    const auto=document.getElementById('auto-login');
    if(!form||!username||!remember||!auto)return;
    try{
        const saved=localStorage.getItem('bokju_login_username');
        if(saved){username.value=saved;remember.checked=true;}
        auto.checked=localStorage.getItem('bokju_auto_login_choice')==='1';
    }catch(e){}
    auto.addEventListener('change',()=>{if(auto.checked)remember.checked=true;});
    remember.addEventListener('change',()=>{if(!remember.checked)auto.checked=false;});
    form.addEventListener('submit',()=>{
        try{
            if(remember.checked)localStorage.setItem('bokju_login_username',username.value.trim());
            else localStorage.removeItem('bokju_login_username');
            localStorage.setItem('bokju_auto_login_choice',auto.checked?'1':'0');
        }catch(e){}
    });
    document.getElementById('password-reset-request').addEventListener('click',()=>{
        const value=username.value.trim();
        if(!value){alert('아이디를 먼저 입력해주세요.');username.focus();return;}
        const resetForm=document.createElement('form');
        resetForm.method='post';resetForm.action='/password-reset/request';
        const hidden=document.createElement('input');
        hidden.type='hidden';hidden.name='username';hidden.value=value;
        resetForm.appendChild(hidden);document.body.appendChild(resetForm);resetForm.submit();
    });
})();
</script>
{% endblock %}
