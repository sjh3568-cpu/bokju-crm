{% extends "base.html" %}
{% block title %}로그인 — 복주 상담실{% endblock %}
{% block content %}
<div class="login-wrap">
    <h1>복주 상담실 CRM</h1>
    <div class="card">
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <div class="field">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width:100%">로그인</button>
            </div>
        </form>
        <p class="note" style="margin-top:14px; text-align:center">
            초기 계정 ID는 <code>admin</code>이며, 비밀번호는 <code>.env</code>의 <code>APP_PASSWORD</code>입니다.
        </p>
    </div>
</div>
{% endblock %}
