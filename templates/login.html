{% extends "base.html" %}
{% block title %}로그인 — 복주 상담실{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-mark">복주</div>
            <h1>복주 상담실 CRM</h1>
            <p class="login-sub">인덕의료재단 · 복주회복병원 상담실</p>
        </div>
        <form method="post" action="/login" class="login-form">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <label class="login-field">
                <span>아이디</span>
                <input type="text" name="username" autocomplete="username" autofocus required
                       placeholder="이름 또는 계정 아이디">
            </label>
            <label class="login-field">
                <span>비밀번호</span>
                <input type="password" name="password" autocomplete="current-password" required
                       placeholder="비밀번호">
            </label>
            <button type="submit" class="btn btn-primary login-submit">로그인</button>
        </form>
        <p class="login-note">
            계정이 없거나 비밀번호를 잊으셨나요? <strong>어드민</strong>에게 문의하세요.
        </p>
    </div>
    <p class="login-footnote">사내망 전용 · 환자 정보는 외부로 전송되지 않습니다.</p>
</div>
{% endblock %}
