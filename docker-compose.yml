# 시놀로지 NAS — Docker(DSM 7.0/7.1) 또는 Container Manager(7.2+) > 프로젝트 에서 생성한다.
# 사전 준비: File Station에서 /volume1/docker/bokju-crm 폴더를 만들고
#            이 저장소 전체를 그 안에 복사, .env 파일을 채워둘 것.
# version 키는 최신 Compose v2에선 선택이지만, DSM에 동봉된 docker-compose 1.x는
# 이게 없으면 파일 전체를 구형(v1) 포맷으로 해석해 실패한다.
# 3.4를 쓰는 이유: healthcheck의 start_period가 3.4부터 지원되고(그 아래로는 못 내려감),
# 3.4는 docker-compose 1.16+ 이면 다 읽는다. 구형 DSM에서도 안전한 하한선.
version: "3.4"

services:
  bokju-crm:
    build: .
    # 운영·개발 컨테이너가 같은 NAS에서 같이 뜬다. 이름과 포트는 각 디렉터리의
    # .env에서 정하고(개발은 bokju-crm-dev / 8004), 기본값은 운영이다.
    container_name: ${CONTAINER_NAME:-bokju-crm}
    restart: unless-stopped          # NAS 재부팅·오류 종료 시 자동 재시작
    ports:
      - "${HOST_PORT:-8003}:8003"     # 사내망에서 http://<NAS주소>:8003 (개발 8004)
    volumes:
      # DB — 반드시 NAS 로컬 볼륨. SMB 공유폴더를 마운트하면 WAL이 깨진다.
      - ./data:/data
      - ./backups:/backups
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      BOKJU_DB_PATH: /data/bokju.db
      BACKUP_DIR: /backups
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/login').read()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
